name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          path: build/apk/app-release.apk
          archive: false
          if-no-files-found: error
